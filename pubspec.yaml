name: studyquest
description: A complete gamified offline-first student planner application.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # Local Alarms & Timezones
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0

  # Data Formats
  excel: ^4.0.0
  csv: ^6.0.0
  file_picker: ^8.1.2
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1

  # UI Libraries
  fl_chart: ^0.68.0
  table_calendar: ^3.1.2
  confetti: ^0.7.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0

  # Audio & Vibration
  audioplayers: ^6.0.0
  vibration: ^2.0.1

  # Network
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/audio/alarm.mp3
    - assets/logo.jpg
